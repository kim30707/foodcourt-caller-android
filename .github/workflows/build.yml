name: build

# main에 push → 테스트, 서명된 APK 빌드, 산출물 업로드
# v로 시작하는 태그(v1.0.0 등) push → 같은 빌드 뒤 GitHub Release에 foodcourt-caller.apk 첨부
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      - name: 버전 정하기
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.0.${{ github.run_number }}"
          fi
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "버전 $NAME (코드 ${{ github.run_number }})"

      - name: 단위 테스트
        run: ./gradlew test --no-daemon

      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 비밀값이 없습니다. docs/keystore.md를 보고 등록하세요."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: 서명된 release APK 빌드
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: APK 이름 고정·서명 확인
        run: |
          cp app/build/outputs/apk/release/app-release.apk foodcourt-caller.apk
          rm -f "$RUNNER_TEMP/release.keystore"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs foodcourt-caller.apk > certs.txt
          grep -E "certificate (DN|SHA-256)" certs.txt || cat certs.txt
          rm -f certs.txt

      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: foodcourt-caller-apk
          path: foodcourt-caller.apk

      - name: GitHub Release 만들기
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: foodcourt-caller.apk
          generate_release_notes: true
